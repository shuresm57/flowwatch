name: CD

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH ind paa serveren og videre ind paa VM'en
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}     
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            ssh ${{ secrets.SSH_USER }}@${{ secrets.FLOWWATCH_SSH_HOST }} 'cd ~/flowwatch && git pull && docker compose pull && docker compose up -d --force-recreate'
