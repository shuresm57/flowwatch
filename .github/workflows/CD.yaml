name: CD

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish Docker image"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy flowwatch
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'ssh ${{ secrets.SSH_USER }}@${{ secrets.FLOWWATCH_SSH_HOST }} "cd ~/flowwatch && git pull && docker compose pull && docker compose up -d --force-recreate"'
